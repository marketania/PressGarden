name: Press family migration bootstrap
on:
  push:
    branches: [refactor/standalone-tool]
    paths: [.github/workflows/press-family-bootstrap.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: target
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: marketania/PressWarden
          ref: 63adec182b4d3a20dbd5e24daa9b9fa0e98510b8
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: marketania/PressWarden
          ref: 2104263eb466ff0537d86a2bb6aedeb51bd3bc9f
          path: workbench
          persist-credentials: false
      - name: Verify and extract migration workbench
        shell: python
        run: |
          import base64, hashlib, io, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'press-build'
          root.mkdir()
          dest = root / 'migration'
          dest.mkdir()
          parts = sorted(pathlib.Path('workbench/migration-payload').glob('part-*.b64'))
          assert len(parts) == 10
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert len(data) == 58088
          assert hashlib.sha256(data).hexdigest() == '0cd69adea8e764493dfa3acb45e52ce1a3448a342ba1df44fe31874b563d5c95'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              members = archive.getmembers()
              assert sum(m.size for m in members) < 2000000
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  out = dest / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.extractfile(member).read())
                  out.chmod(0o644)
          print('Verified pinned workbench; no downloaded code executed before hash validation.')
      - name: Generate independent source trees
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/press-build/migration/build.py" --source "$GITHUB_WORKSPACE/upstream" --out "$RUNNER_TEMP/press-build/products"
          python3 "$RUNNER_TEMP/press-build/migration/build_warden.py" "$GITHUB_WORKSPACE/upstream" "$RUNNER_TEMP/press-build/products"
      - name: Validate standalone product
        shell: bash
        env:
          PRESS_TEST_LOG_DIR: ${{ runner.temp }}/press-tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/press-build/products/PressGarden"
          test "$(cat PRODUCT)" = PressGarden
          bash tests/run.sh
      - name: Publish normal source files only to review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = marketania/PressGarden
          test "$GITHUB_REF_NAME" = refactor/standalone-tool
          rsync -a --delete --exclude=.git --exclude=.github/ "$RUNNER_TEMP/press-build/products/PressGarden/" target/
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: extract independent PressGarden from PressWarden 1.1.24' -m 'Provenance: marketania/PressWarden@63adec182b4d3a20dbd5e24daa9b9fa0e98510b8. MIT authorship retained. Independent implementation, installer, updater, namespaces, maintenance and LiteSpeed tests. Workflow migration is completed separately through the maintainer connection.'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/refactor/standalone-tool
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PressGarden-migration-validation
          path: |
            ${{ runner.temp }}/press-tests/
            ${{ runner.temp }}/press-build/products/audit/
          retention-days: 7
