name: PressGarden independent validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
# Cancel superseded runs of the same pull request. Main and manual runs get a
# unique group so every exact-commit run finishes for the release gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Heavy-check scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Skip PHP matrix and WordPress jobs only for draft or documentation-only pull requests
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          # Fail safe: anything other than a confirmed draft or docs-only pull request runs everything.
          heavy=true
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ "$IS_DRAFT" = true ]; then
              heavy=false
            elif changed=$(git diff --name-only HEAD^1 HEAD) && [ -n "$changed" ]; then
              if ! grep -qvE '(^docs/|\.md$)' <<<"$changed"; then heavy=false; fi
            fi
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "Run PHP matrix and WordPress jobs: $heavy"
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck error diagnostics
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -t files < <(git ls-files '*.sh')
          program=$(tr '[:upper:]' '[:lower:]' < PRODUCT)
          shellcheck --severity=error --shell=bash --format=gcc "$program" "${files[@]}"
      - name: Independent local syntax and benign-fixture tests
        env:
          PRESS_TEST_LOG_DIR: ${{ runner.temp }}/press-tests
        run: bash scripts/check.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: local-test-logs
          path: ${{ runner.temp }}/press-tests/
          retention-days: 7
  php-supported:
    name: PHP ${{ matrix.php }} contracts
    needs: changes
    # Matrix jobs skipped at job level report an unexpanded check name, so gate steps instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Draft or documentation-only pull request
        if: needs.changes.outputs.heavy == 'false'
        run: echo 'Skipped; runs when the pull request has code changes and is ready for review.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.heavy != 'false'
        with:
          persist-credentials: false
      - name: Supported PHP syntax and pure contracts
        if: needs.changes.outputs.heavy != 'false'
        env:
          PHP_SERIES: ${{ matrix.php }}
        run: |
          docker run --rm --network=none -v "$PWD:/work:ro" -w /work "php:${PHP_SERIES}-cli" bash -c 'set -eu; php -v; for f in lib/*.php; do php -l "$f" >/dev/null; done; for f in tests/*.php; do case "$f" in */db-mysql.php) continue;; esac; php "$f"; done'
  php74:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP 7.4 syntax and pure contract tests
        run: |
          docker run --rm --network=none -v "$PWD:/work:ro" -w /work php:7.4-cli bash -c 'set -eu; for f in lib/*.php; do php -l "$f" >/dev/null; done; for f in tests/*.php; do case "$f" in */db-mysql.php) continue;; esac; php "$f"; done'
  wordpress:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: press-family-ephemeral-ci
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppress-family-ephemeral-ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test-only WP-CLI
        run: |
          mkdir -p "$RUNNER_TEMP/wp-bin"
          curl -fsSL --proto '=https' --proto-redir '=https' https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$RUNNER_TEMP/wp-bin/wp"
          chmod +x "$RUNNER_TEMP/wp-bin/wp"
          echo "$RUNNER_TEMP/wp-bin" >> "$GITHUB_PATH"
      - name: Fresh isolated WordPress and MySQL integration
        env:
          PRESS_FAMILY_ALLOW_ISOLATED_WP_TEST: '1'
          PRESS_TEST_DB_PASSWORD: press-family-ephemeral-ci
        run: bash tests/live-wp.sh
      - name: Isolated database backup and restore drill
        env:
          PRESSGARDEN_ALLOW_ISOLATED_RESTORE_TEST: '1'
          PRESS_TEST_DB_PASSWORD: press-family-ephemeral-ci
        run: python3 tests/integration/database-restore.py
