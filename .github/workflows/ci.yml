name: PressGarden independent validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  local:
    outputs:
      full: ${{ steps.scope.outputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify cumulative pull request scope
        id: scope
        run: python3 .github/scripts/ci_scope.py
      - name: ShellCheck error diagnostics
        if: ${{ steps.scope.outputs.full != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -t files < <(git ls-files '*.sh')
          program=$(tr '[:upper:]' '[:lower:]' < PRODUCT)
          shellcheck --severity=error --shell=bash --format=gcc "$program" "${files[@]}"
      - name: Independent local syntax and benign-fixture tests
        if: ${{ steps.scope.outputs.full != 'false' }}
        env:
          PRESS_TEST_LOG_DIR: ${{ runner.temp }}/press-tests
        run: bash scripts/check.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && steps.scope.outputs.full != 'false' }}
        with:
          name: local-test-logs
          path: ${{ runner.temp }}/press-tests/
          retention-days: 1
      - name: Documentation and CI scope contracts
        if: ${{ steps.scope.outputs.full == 'false' }}
        run: |
          python3 -B tests/ci-scope.py
          python3 -B tests/documentation.py
          python3 -B tests/distribution.py
          python3 -B tests/public-distribution.py
  php-supported:
    needs: local
    if: ${{ !cancelled() }}
    name: PHP ${{ matrix.php }} contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ success() && (needs.local.result != 'success' || needs.local.outputs.full != 'false') }}
        with:
          persist-credentials: false
      - name: Supported PHP syntax and pure contracts
        if: ${{ success() && (needs.local.result != 'success' || needs.local.outputs.full != 'false') }}
        env:
          PHP_SERIES: ${{ matrix.php }}
        run: |
          docker run --rm --network=none -v "$PWD:/work:ro" -w /work "php:${PHP_SERIES}-cli" bash -c 'set -eu; php -v; for f in lib/*.php; do php -l "$f" >/dev/null; done; for f in tests/*.php; do case "$f" in */db-mysql.php) continue;; esac; php "$f"; done'
      - name: Preserve documentation-only matrix check context
        if: ${{ needs.local.result == 'success' && needs.local.outputs.full == 'false' }}
        run: echo 'Documentation-only PR; PHP container work is not applicable.'
  php74:
    needs: local
    if: ${{ !cancelled() && (needs.local.result != 'success' || needs.local.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP 7.4 syntax and pure contract tests
        run: |
          docker run --rm --network=none -v "$PWD:/work:ro" -w /work php:7.4-cli bash -c 'set -eu; for f in lib/*.php; do php -l "$f" >/dev/null; done; for f in tests/*.php; do case "$f" in */db-mysql.php) continue;; esac; php "$f"; done'
  wordpress:
    needs: local
    if: ${{ !cancelled() && (needs.local.result != 'success' || needs.local.outputs.full != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: press-family-ephemeral-ci
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppress-family-ephemeral-ci"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test-only WP-CLI
        run: |
          mkdir -p "$RUNNER_TEMP/wp-bin"
          curl -fsSL --proto '=https' --proto-redir '=https' https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$RUNNER_TEMP/wp-bin/wp"
          chmod +x "$RUNNER_TEMP/wp-bin/wp"
          echo "$RUNNER_TEMP/wp-bin" >> "$GITHUB_PATH"
      - name: Fresh isolated WordPress and MySQL integration
        env:
          PRESS_FAMILY_ALLOW_ISOLATED_WP_TEST: '1'
          PRESS_TEST_DB_PASSWORD: press-family-ephemeral-ci
        run: bash tests/live-wp.sh
      - name: Isolated database backup and restore drill
        env:
          PRESSGARDEN_ALLOW_ISOLATED_RESTORE_TEST: '1'
          PRESS_TEST_DB_PASSWORD: press-family-ephemeral-ci
        run: python3 tests/integration/database-restore.py
